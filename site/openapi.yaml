openapi: 3.1.0
info:
  title: Dinky
  version: "0.0.0"
  description: |
    dinkyfiles.com is a static marketing site: there is no public HTTP API here (paths below are empty).

    Separately, the Dinky *product* in the open-source repository includes an optional local-only `dinky serve`
    command (HTTP on 127.0.0.1 / [::1] of the user's Mac only, bearer-token protected, browser Origin requests
    refused) for images. That interface is not hosted on dinkyfiles.com; see the repo file `docs/local-cli.md`
    for authentication, the JSON schema (`dinky.image.compress/1.0.0`), and example requests.

    This document exists for machine-readable discovery of the *website* (RFC 9727 service-desc, empty paths).
paths: {}
